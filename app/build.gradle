plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp' version '2.2.10-2.0.2'
    id 'androidx.room' version '2.6.1'
}

def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.canRead()) {
    versionProps.load(new FileInputStream(versionPropsFile))
} else {
    throw new GradleException("Could not read version.properties!")
}

android {
    namespace = 'in.iambhvsh.outflow'
    compileSdk 37

    defaultConfig {
        applicationId 'in.iambhvsh.outflow'
        minSdk 24
        targetSdk 37
        versionCode versionProps['VERSION_CODE'].toInteger()
        versionName versionProps['VERSION_NAME'].toString()

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("secrets/keystore.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.canRead()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
}

room {
    schemaDirectory("$projectDir/schemas")
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.08.00')

    // Compose UI toolkit (versions come from the BOM).
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Material 3 Expressive. Pinned ahead of the BOM: SegmentedListItem, ToggleButton,
    // HorizontalFloatingToolbar and the flexible top app bars only exist in 1.5.0.
    implementation 'androidx.compose.material3:material3:1.5.0-alpha22'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.materialkolor:material-kolor:1.7.0'

    // AndroidX core + the Activity <-> Compose bridge (setContent { ... }).
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Holds the launch screen until the stored settings have been read, on every API level.
    implementation 'androidx.core:core-splashscreen:1.2.0'
    constraints {
        // core-splashscreen asks for appcompat-resources 1.7.0; 1.7.1 is the build's own resolution.
        implementation 'androidx.appcompat:appcompat-resources:1.7.1'
    }

    // Debug-only tooling: Layout Inspector support and @Preview rendering.
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Room persistence
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    
    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
}
