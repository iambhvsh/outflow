# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run tasks in parallel where possible.
org.gradle.parallel=true

# Use AndroidX (rather than the legacy Support Library) artifacts.
android.useAndroidX=true

# Each library gets its own, non-transitive R class (smaller, faster builds).
android.nonTransitiveRClass=true

# Kotlin code style for the 'kotlin' formatter.
kotlin.code.style=official

# Allow KSP plugin to add sources despite built-in Kotlin in AGP 9
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
